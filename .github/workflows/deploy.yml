name: deploy-to-gce

on:
  pull_request:
    types: [labeled]

concurrency:
  group: deploy-${{ github.event.label.name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # デプロイ対象のPRを事前に検証するガードジョブ。
  # フォークPR・main以外のターゲット・マージ不可能なPRはデプロイを拒否する。
  validate-deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'dev' || github.event.label.name == 'stg' || github.event.label.name == 'prd')
    steps:
      - name: Reject fork pull requests
        run: |
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "::error::Deploy from a fork pull request is not allowed."
            exit 1
          fi

      - name: Reject non-mainline pull requests
        run: |
          if [[ "${{ github.event.pull_request.base.ref }}" != "main" ]]; then
            echo "::error::Deploy is only allowed for pull requests targeting the main branch."
            exit 1
          fi

      - name: Reject unmergeable pull requests
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ -z "$MERGE_COMMIT_SHA" ]]; then
            echo "::error::Pull request is not mergeable. Only the merge commit of main can be deployed."
            exit 1
          fi

      - name: Confirm team gating
        run: |
          echo "Deployment is gated on organization team membership (enforce_deploy_team=true, deploy_team_slug=deg-develop)."

  deploy:
    needs: validate-deploy
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'dev' || github.event.label.name == 'stg' || github.event.label.name == 'prd')
    uses: deg-labs/github-workflows/.github/workflows/gce-deploy.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      checkout_submodules: true
      enforce_deploy_team: true
      deploy_team_slug: deg-develop
      start_instance: ${{ github.event.label.name != 'prd' }}
      gce_instance_secret: ${{ github.event.label.name == 'dev' && 'DEV_GCE_INSTANCE_NAME' || github.event.label.name == 'stg' && 'STG_GCE_INSTANCE_NAME' || 'PRD_GCE_INSTANCE_NAME' }}
      gce_zone_secret: GCE_ZONE
      gcp_sa_email_secret: ${{ github.event.label.name == 'dev' && 'DEV_GCP_SA_EMAIL' || github.event.label.name == 'stg' && 'STG_GCP_SA_EMAIL' || 'PRD_GCP_SA_EMAIL' }}
      gcp_wif_provider_secret: ${{ github.event.label.name == 'dev' && 'DEV_GCP_WIF_PROVIDER' || github.event.label.name == 'stg' && 'STG_GCP_WIF_PROVIDER' || 'PRD_GCP_WIF_PROVIDER' }}
      app_env_secret: ${{ github.event.label.name == 'dev' && 'DEV_APP_ENV' || github.event.label.name == 'stg' && 'STG_APP_ENV' || 'PRD_APP_ENV' }}
      github_app_id_secret: ORG_GH_APP_ID
      github_app_private_key_secret: ORG_GH_APP_PRIVATE_KEY
      artifact_excludes: |
        server/data
        server/logs
        client/ncmma/data
        client/ncmma/logs
        client/ncmma/cache
      additional_upload_files: |
        .env
      prepare_command: |
        set -euo pipefail
        # ラベル付与時点のPRヘッドではなく、mainへのマージ結果のSHAのみをデプロイする
        PR_MERGE_COMMIT_SHA="${{ github.event.pull_request.merge_commit_sha }}"
        if [[ -z "$PR_MERGE_COMMIT_SHA" ]]; then
          echo "No merge commit SHA available. Aborting deployment." >&2
          exit 1
        fi
        git fetch origin "$PR_MERGE_COMMIT_SHA"
        git checkout -f "$PR_MERGE_COMMIT_SHA"
        git submodule update --init --recursive
        sed -i 's/GOARCH=amd64/GOARCH="$(go env GOARCH)"/g' server/api/Dockerfile
        sed -i 's/GOARCH=amd64/GOARCH="$(go env GOARCH)"/g' server/fetcher/Dockerfile
        printf '%s\n' "${APP_ENV}" > .env
      remote_deploy_command: |
        set -e
        TARGET_DIR='/opt/apps/volatility-monorepo'
        sudo rm -rf "$TARGET_DIR"
        sudo mkdir -p "$TARGET_DIR"
        sudo chown -R "$(id -u):$(id -g)" "$TARGET_DIR"
        tar -xzf ~/app.tar.gz -C "$TARGET_DIR"
        mv -f ~/.env "$TARGET_DIR/.env"
        cd "$TARGET_DIR"
        sudo docker compose down
        sudo docker compose up -d --build
        sudo docker image prune -f || true
