name: deploy-to-gce

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
        default: prd

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: deg-labs/github-workflows/.github/workflows/gce-deploy.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      checkout_submodules: true
      enforce_deploy_team: true
      deploy_team_slug: deg-develop
      environment_name: ${{ github.event.inputs.environment || 'prd' }}
      start_instance: ${{ (github.event.inputs.environment || 'prd') != 'prd' }}
      gce_instance_secret: ${{ (github.event.inputs.environment || 'prd') == 'dev' && 'DEV_GCE_INSTANCE_NAME' || (github.event.inputs.environment || 'prd') == 'stg' && 'STG_GCE_INSTANCE_NAME' || 'PRD_GCE_INSTANCE_NAME' }}
      gce_zone_secret: GCE_ZONE
      gcp_sa_email_secret: ${{ (github.event.inputs.environment || 'prd') == 'dev' && 'DEV_GCP_SA_EMAIL' || (github.event.inputs.environment || 'prd') == 'stg' && 'STG_GCP_SA_EMAIL' || 'PRD_GCP_SA_EMAIL' }}
      gcp_wif_provider_secret: ${{ (github.event.inputs.environment || 'prd') == 'dev' && 'DEV_GCP_WIF_PROVIDER' || (github.event.inputs.environment || 'prd') == 'stg' && 'STG_GCP_WIF_PROVIDER' || 'PRD_GCP_WIF_PROVIDER' }}
      app_env_secret: ${{ (github.event.inputs.environment || 'prd') == 'dev' && 'DEV_APP_ENV' || (github.event.inputs.environment || 'prd') == 'stg' && 'STG_APP_ENV' || 'PRD_APP_ENV' }}
      github_app_id_secret: ORG_GH_APP_ID
      github_app_private_key_secret: ORG_GH_APP_PRIVATE_KEY
      artifact_excludes: |
        server/data
        server/logs
        client/ncmma/data
        client/ncmma/logs
        client/ncmma/cache
      additional_upload_files: |
        .env
      prepare_command: |
        set -euo pipefail
        # reusable workflow側でpushされたmainのgithub.shaをcheckout済み。
        git submodule update --init --recursive
        sed -i 's/GOARCH=amd64/GOARCH="$(go env GOARCH)"/g' server/api/Dockerfile
        sed -i 's/GOARCH=amd64/GOARCH="$(go env GOARCH)"/g' server/fetcher/Dockerfile
        printf '%s\n' "${APP_ENV}" > .env
      remote_deploy_command: |
        set -e
        TARGET_DIR='/opt/apps/volatility-monorepo'
        sudo rm -rf "$TARGET_DIR"
        sudo mkdir -p "$TARGET_DIR"
        sudo chown -R "$(id -u):$(id -g)" "$TARGET_DIR"
        tar -xzf ~/app.tar.gz -C "$TARGET_DIR"
        mv -f ~/.env "$TARGET_DIR/.env"
        cd "$TARGET_DIR"
        sudo docker compose down
        sudo docker compose up -d --build
        sudo docker image prune -f || true
