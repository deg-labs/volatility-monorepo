name: deploy-to-gce

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
        default: prd

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'dev' || github.event.label.name == 'stg' ||
        github.event.label.name == 'prd'))
    uses: deg-labs/github-workflows/.github/workflows/gce-deploy.yml@6828f512b6065d45b92cec65035690318e108ef5
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      checkout_submodules: true
      enforce_deploy_team: true
      deploy_team_slug: deg-develop
      environment_name: >-
        ${{
          github.event_name == 'pull_request' && github.event.label.name ||
          github.event_name == 'workflow_dispatch' && inputs.environment ||
          'prd'
        }}
      app_env_secret: >-
        ${{
          (github.event_name == 'pull_request' && github.event.label.name == 'dev' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') && 'DEV_APP_ENV' ||
          (github.event_name == 'pull_request' && github.event.label.name == 'stg' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'stg') && 'STG_APP_ENV' ||
          'PRD_APP_ENV'
        }}
      deploy_mode: compose
